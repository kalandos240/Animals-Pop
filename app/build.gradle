plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nativegame.animalspop'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "ru.kalandos240.animalspop"
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            buildConfigField 'String', 'REWARDED_AD_UNIT_ID', '"demo-rewarded-yandex"'
        }
        release {
            buildConfigField 'String', 'REWARDED_AD_UNIT_ID', '"' + providers.gradleProperty('yandexRewardedAdUnitId').getOrElse('') + '"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.yandex.android:mobileads:8.6.0'
    implementation 'com.github.nativegamestudio:natty-engine:1.0'
}
// Refuse a production artifact with missing or demo advertising credentials.
tasks.configureEach { task ->
    if (task.name in ['assembleRelease', 'bundleRelease', 'packageRelease']) {
        task.doFirst {
            def adId = providers.gradleProperty('yandexRewardedAdUnitId').getOrElse('')
            if (!(adId ==~ /R-M-[0-9]+-[0-9]+/)) {
                throw new GradleException('Set -PyandexRewardedAdUnitId=R-M-... from your Yandex account before building release')
            }
        }
    }
}
