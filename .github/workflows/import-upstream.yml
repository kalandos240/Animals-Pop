name: Import upstream sources
on:
  push:
    paths: ['.github/workflows/import-upstream.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned MIT sources
        run: |
          git clone https://github.com/natygames/animals-pop.git /tmp/animals-pop-upstream
          git -C /tmp/animals-pop-upstream checkout c82c5d0a3af23293f0c14e0e0ab05ef71b4e0a4e
          rsync -a --exclude=.git --exclude=.idea /tmp/animals-pop-upstream/ ./
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Import Animals Pop MIT sources from natygames at c82c5d0"
          git push
